  <!-- Design-system typefaces: Inter (structural) + Fraunces (editorial) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Fraunces:opsz,SOFT,WONK,wght@9..144,0..100,0..1,100..900&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ======================================================================
       LEVY — minimal one-page site
       Tokens, type roles and layout mirror the repo design system
       (docs/LEVY_DESIGN_SYSTEM.md, src/styles/*). Accent: violet.
       ====================================================================== */
    :root {
      /* Color tokens (LEVY_DESIGN_SYSTEM.md) */
      --mission-white:     #F4F4F4;
      --midnight-navy:     #0A111F;
      --violet-atmosphere: #6B21A8;   /* accent */

      --bg-color:     var(--mission-white);
      --text-color:   var(--midnight-navy);
      --border-color: rgba(10, 17, 31, 0.15);

      /* Type */
      --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-mono:  ui-monospace, 'SFMono-Regular', Menlo, monospace;

      /* Spacing / layout */
      --space-layout-x: clamp(1.5rem, 4vw, 5rem);
      --space-grid-gap: 1.5rem;

      --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    ::selection { background: var(--violet-atmosphere); color: var(--mission-white); }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Signature paper grain — static materiality layer */
    .paper-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      mix-blend-mode: multiply;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* --- Stage: vertically centered composition ---------------------------- */
    .stage {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(3rem, 10vh, 7rem) var(--space-layout-x) 0;
      position: relative;
      z-index: 10;
    }

    /* --- Swiss 12-column grid + metadata rail (design system) -------------- */
    .swiss-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--space-grid-gap);
      width: 100%;
      max-width: 1600px;
      align-items: start;
    }
    .rail    { grid-column: 1 / 2; }
    .content { grid-column: 2 / 12; }

    /* Metadata rail — vertical label */
    .vertical-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.4;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-top: 0.35rem;
    }
    .vertical-label::before {
      content: '';
      width: 1px;
      height: 3rem;
      background: currentColor;
    }

    /* Dimension label — kicker with diagonal tick */
    .dimension {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.5;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .dimension::before {
      content: '';
      width: 1.5rem;
      height: 1px;
      background: currentColor;
      display: block;
      transform: rotate(45deg);
      transform-origin: left center;
      flex-shrink: 0;
    }

    /* Logo mark (Icon.svg) — sits above the wordmark as a lockup */
    .mark {
      display: block;
      height: clamp(2.5rem, 5vw, 3.75rem);
      width: auto;
      color: var(--text-color);
      margin-bottom: clamp(1.5rem, 3.5vh, 2.5rem);
    }

    /* Wordmark — Inter, structural voice, tight tracking (see .logotype) */
    .wordmark {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(3.5rem, 12vw, 8rem);
      letter-spacing: -0.05em;
      line-height: 0.9;
    }

    /* Editorial block — Fraunces, styled as plain sentences */
    .studio,
    .intersection {
      font-family: var(--font-serif);
      font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144;
      font-weight: 300;
      font-size: clamp(1.85rem, 4.6vw, 3.1rem);
      letter-spacing: -0.015em;
      line-height: 1.15;
      max-width: 20ch;
    }
    .studio       { margin-top: clamp(2.25rem, 6vh, 4rem); }
    .intersection { margin-top: 0.4em; }

    /* Offer line — Inter light body */
    .offer {
      font-family: var(--font-sans);
      font-weight: 300;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      line-height: 1.5;
      margin-top: clamp(1.5rem, 4vh, 2.5rem);
    }

    /* --- Footer, quiet ----------------------------------------------------- */
    .site-footer {
      position: relative;
      z-index: 10;
      padding: clamp(3rem, 9vh, 6rem) var(--space-layout-x) clamp(1.75rem, 5vh, 2.5rem);
    }
    .footer-inner {
      max-width: 1600px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--space-grid-gap);
      align-items: baseline;
    }
    .footer-note {
      grid-column: 2 / 9;
      font-family: var(--font-sans);
      font-weight: 300;
      font-size: 0.8125rem;
      letter-spacing: 0.01em;
      opacity: 0.5;
    }
    .footer-contact {
      grid-column: 8 / 12;
      justify-self: end;
      display: flex;
      gap: 1.75rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
    }
    .footer-contact a { white-space: nowrap; }

    /* --- Links ------------------------------------------------------------- */
    a { color: inherit; text-decoration: none; }

    /* The two verbs: violet underline; shift to violet on hover/focus */
    .verb {
      text-decoration: underline;
      text-decoration-color: var(--violet-atmosphere);
      text-decoration-thickness: 2px;
      text-underline-offset: 0.18em;
      transition: color 0.25s var(--ease-expo), text-decoration-color 0.25s var(--ease-expo);
    }
    .verb:hover,
    .verb:focus-visible { color: var(--violet-atmosphere); }

    /* Contact: violet underline; shift to violet on hover/focus */
    .contact {
      text-decoration: underline;
      text-decoration-color: var(--violet-atmosphere);
      text-decoration-thickness: 2px;
      text-underline-offset: 0.18em;
      transition: color 0.25s var(--ease-expo), text-decoration-color 0.25s var(--ease-expo);
    }
    .contact:hover,
    .contact:focus-visible { color: var(--violet-atmosphere); }

    /* Visible keyboard focus states */
    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
      border-radius: 2px;
    }

    /* --- Mobile: grid collapses, rail flips horizontal (design system) ----- */
    @media (max-width: 900px) {
      .swiss-grid, .footer-inner { grid-template-columns: 1fr; }
      .rail, .content,
      .footer-note, .footer-contact { grid-column: 1 / -1; }

      .vertical-label {
        writing-mode: horizontal-tb;
        flex-direction: row;
        margin: 0 0 2rem;
      }
      .vertical-label::before { width: 3rem; height: 1px; }

      .footer-contact { justify-self: start; margin-top: 1rem; }
      .intersection { max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>

<body>

      <div class="content">

            <path d="M5205 3959 c-21 -6 -305 -282 -923 -896 -893 -888 -893 -888 -892 -931 0 -50 20 -94 52 -116 20 -14 211 -16 1856 -16 1834 0 1834 0 1867 33 60 60 59 132 -3 193 -20 20 -432 413 -915 873 -517 492 -893 843 -915 853 -40 19 -80 21 -127 7z"/>

</body>
